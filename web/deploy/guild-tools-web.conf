# Guild Tools phone page. Included from the default nginx site, which already limits every request to the tailnet (allow 100.64.0.0/10,
# fd7a:115c:a1e0::/48, localhost; deny all) and receives https from Tailscale Serve.
#
# The page is READ-ONLY and never holds a secret: the browser calls /guild/api/*, and nginx forwards each call to the Guild Tools
# proxy with the proxy key added here (snippets/guild-tools-gateway.conf, root-only, written by deploy.sh). Only these four routes exist,
# each with the one method the page needs; everything else under /guild/api/ is a 404.

# The roster route is a POST on the proxy (it runs the cached fetch) but changes no guild data.
location = /guild/api/roster {
    limit_except POST { deny all; }
    include snippets/guild-tools-gateway.conf;
    proxy_pass http://127.0.0.1:8010/roster;
}
location = /guild/api/loot-records {
    limit_except GET { deny all; }
    include snippets/guild-tools-gateway.conf;
    proxy_pass http://127.0.0.1:8010/loot-records;
}
location = /guild/api/loot-capture/heartbeats {
    limit_except GET { deny all; }
    include snippets/guild-tools-gateway.conf;
    proxy_pass http://127.0.0.1:8010/loot-capture/heartbeats;
}
location = /guild/api/professions/cached {
    limit_except GET { deny all; }
    include snippets/guild-tools-gateway.conf;
    proxy_pass http://127.0.0.1:8010/professions/cached;
}
location /guild/api/ {
    return 404;
}

location = /guild {
    return 301 https://mct-vps.tailc6de61.ts.net/guild/;
}

# The page shell must always be revalidated so an update shows up; hashed assets can be cached for good.
location = /guild/manifest.webmanifest {
    root /var/www;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
location ~ ^/guild/(index\.html|sw\.js)$ {
    root /var/www;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
location /guild/assets/ {
    root /var/www;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
location /guild/ {
    # https (from Tailscale Serve) is needed for the home-screen app; send plain-http tailnet visits there, like the site root does.
    if ($tailnet_http) { return 301 https://mct-vps.tailc6de61.ts.net$request_uri; }
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
