# Guild Tools TEST downloads. Included from the default nginx site, which already limits every request to the tailnet
# (allow 100.64.0.0/10, fd7a:115c:a1e0::/48, localhost; deny all). Static files only: the Test installer, the test addon zip and a
# small index page. Nothing here talks to the Guild Tools proxy. The files live in /var/www/guild-test, apart from the phone page's
# /var/www/guild, so publishing one never touches the other.
location = /guild/test {
    return 301 https://mct-vps.tailc6de61.ts.net/guild/test/;
}
location /guild/test/ {
    if ($tailnet_http) { return 301 https://mct-vps.tailc6de61.ts.net$request_uri; }
    alias /var/www/guild-test/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
